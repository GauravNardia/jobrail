[package]
name = "axum-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

jobrail-core = { path = "../core" }
jobrail-redis = { path = "../jobrail-redis" }
redis = { version = "1.7.0", features = ["tokio-comp"] }
tower = "0.5.3"
http-body-util = "0.1.5"
serial_test = "4.0.1"
