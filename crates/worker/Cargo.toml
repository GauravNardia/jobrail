[package]
name = "jobrail-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
jobrail-core = { path = "../core" }
jobrail-redis = { path = "../jobrail-redis" }
redis = { version = "1.7.0", features = ["connection-manager", "tokio-comp"] }
serde_json = "1.0.151"
serial_test = "4.0.1"
tokio = { version = "1.53.1", features = ["full"] }
uuid = "1.26.1"
